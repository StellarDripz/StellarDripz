name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-label:
    name: Auto-Label Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
