name: Contract Deploy (Testnet)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: "Stellar network"
        required: true
        type: choice
        options:
          - testnet
          - futurenet
        default: testnet

jobs:
  deploy-contracts:
    name: Deploy Contracts to Testnet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

      - name: Verify WASM build
        run: |
          WASM_PATH="target/wasm32v1-none/release/stellardripz.wasm"
          if [ -f "$WASM_PATH" ]; then
            SIZE=$(stat -c%s "$WASM_PATH")
            echo "✅ WASM ready: $(( SIZE / 1024 )) KB"
          else
            echo "❌ WASM build failed — file not found"
            exit 1
          fi

      - name: Deploy to Stellar
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET || '' }}
          STELLAR_NETWORK: ${{ inputs.network || 'testnet' }}
        run: |
          echo "Contract WASM built. Deployment script ready."
          echo "Network: $STELLAR_NETWORK"
          if [ -n "$STELLAR_SECRET_KEY" ]; then
            echo "Deployer key configured — ready for deployment."
          else
            echo "No STELLAR_DEPLOYER_SECRET configured — skipping live deploy."
          fi
