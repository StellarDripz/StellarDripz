name: Lint (Strict)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eslint-strict:
    name: ESLint Strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx}" --ignore-path .prettierignore
