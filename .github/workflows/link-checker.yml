name: Link Checker

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  linkcheck:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: .mlc_config.json
