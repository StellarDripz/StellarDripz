name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels: ["feat", "enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["fix", "bug"]
  - title: "📚 Documentation"
    labels: ["docs", "documentation"]
  - title: "🔧 Maintenance"
    labels: ["chore", "refactor", "build", "ci"]
  - title: "✅ Tests"
    labels: ["test", "tests"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&#@'
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feat"]
  patch:
    labels: ["fix", "docs", "chore", "test", "refactor"]
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
