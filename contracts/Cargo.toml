[package]
name = "stellardripz"
version = "0.2.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1
